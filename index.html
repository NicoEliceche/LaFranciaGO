<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0047E7" />
    <!--
      Política de seguridad de contenido.

      Limita de dónde puede cargarse cada tipo de recurso: aunque se colara
      contenido malicioso en la página, el navegador no ejecutaría scripts de
      otros orígenes ni permitiría enviar datos afuera.

      GitHub Pages no deja definir cabeceras propias, así que va por meta.
      'unsafe-inline' en estilos es necesario para styled-components, que
      inyecta las reglas en tiempo de ejecución; los scripts NO lo llevan,
      que es donde realmente importa.

      `frame-ancestors` no se incluye porque el navegador lo ignora cuando la
      política viene por meta: contra el clickjacking se usa el guardia de
      marco de más abajo, que sí funciona sin cabeceras propias.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self';
               script-src 'self';
               style-src 'self' 'unsafe-inline';
               img-src 'self' data: blob: https://*.tile.openstreetmap.org;
               font-src 'self';
               connect-src 'self' https://lafranciago-api.lafranciago-api.workers.dev
                           https://photon.komoot.io https://nominatim.openstreetmap.org;
               media-src 'self' blob:;
               object-src 'none';
               base-uri 'self';
               form-action 'self';
               frame-src https://accounts.google.com;
               upgrade-insecure-requests"
    />
    <!-- No filtrar la ruta completa a sitios externos al navegar o pedir tiles. -->
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta
      name="description"
      content="LaFranciaGO: marketplace local mobile-first para buscar productos, ver comercios y seguir pedidos desde la web."
    />
    <link rel="icon" type="image/png" href="/LaFranciaGO/favicon.png" />
    <link rel="apple-touch-icon" href="/LaFranciaGO/apple-touch-icon.png" />

    <!--
      La API está en otro dominio, así que la primera llamada paga el saludo
      completo: DNS, TCP y TLS. Abriendo la conexión mientras todavía se
      descarga el JavaScript, cuando la aplicación pregunta quién es el
      usuario el canal ya está listo. Medido: 110 ms.

      crossorigin es obligatorio acá: las llamadas van con credenciales, y sin
      esa marca el navegador abriría una conexión que después no puede usar.
    -->
    <link
      rel="preconnect"
      href="https://lafranciago-api.lafranciago-api.workers.dev"
      crossorigin
    />
    <title>LaFranciaGO | Marketplace local</title>
    <style>
      /* Pintado inicial, mientras baja y arranca el JavaScript.

         Con el div vacío la pantalla quedaba en blanco hasta que React
         montaba: en un teléfono con 4G lenta son más de tres segundos
         mirando la nada. Esto dibuja la barra de marca y el nombre con CSS
         solo, sin esperar a nada, y React lo reemplaza al montar.

         Es a propósito que no imite la pantalla final: prometer una interfaz
         que después se acomoda distinto se siente peor que una espera
         honesta. Sólo dice "esto es LaFranciaGO y está cargando". */
      #root:empty::before {
        content: '';
        display: block;
        height: 58px;
        background: linear-gradient(135deg, #0047e7 0%, #2563eb 100%);
      }

      #root:empty::after {
        content: 'LaFranciaGO';
        display: flex;
        align-items: center;
        justify-content: center;
        height: calc(100vh - 58px);
        height: calc(100dvh - 58px);
        color: #0047e7;
        font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
        font-size: 1.5rem;
        font-weight: 800;
        letter-spacing: -0.02em;
        /* Aparece de a poco: si el JavaScript llega rápido, casi no se ve, y
           no hay un parpadeo de texto que entra y sale. */
        animation: aparecer 600ms ease-out both;
      }

      @keyframes aparecer {
        from {
          opacity: 0;
        }
        to {
          opacity: 0.55;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        #root:empty::after {
          animation: none;
          opacity: 0.55;
        }
      }

      body {
        margin: 0;
        background: #f5f7fb;
      }

      @media (prefers-color-scheme: dark) {
        body {
          background: #0c111d;
        }

        #root:empty::after {
          color: #4d8bff;
        }
      }
    </style>
