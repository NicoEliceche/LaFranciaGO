<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" width="480" height="480" role="img">
  <!-- Rotisería: milanesa con papas fritas y una empanada, que es el plato
       que se pide. Un pollo entero visto de frente termina leyéndose como
       una masa dorada cualquiera; el plato servido se reconoce enseguida. -->
  <defs>
    <linearGradient id="rot-fondo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7C2D12"/>
      <stop offset="1" stop-color="#EA580C"/>
    </linearGradient>
    <radialGradient id="rot-luz" cx="30%" cy="16%" r="70%">
      <stop offset="0" stop-color="#FED7AA" stop-opacity=".38"/>
      <stop offset="1" stop-color="#FED7AA" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="480" height="480" fill="url(#rot-fondo)"/>
  <rect width="480" height="480" fill="url(#rot-luz)"/>

  <!-- Plato -->
  <g>
    <ellipse cx="240" cy="290" rx="176" ry="70" fill="#CBD5E1"/>
    <ellipse cx="240" cy="280" rx="176" ry="70" fill="#F1F5F9"/>
    <ellipse cx="240" cy="278" rx="138" ry="52" fill="#E2E8F0"/>
  </g>

  <!-- Milanesa: rectángulo redondeado con rebozado, inconfundible -->
  <g transform="translate(118 196) rotate(-6)">
    <path d="M12 0h150a58 58 0 0 1 0 116H12A58 58 0 0 1 12 0z" fill="#C2740F"/>
    <path d="M12 0h150a58 58 0 0 1 0 110H12A58 58 0 0 1 12 0z" fill="#E09A45"/>
    <!-- Textura del pan rallado -->
    <g fill="#B0701F" opacity=".5">
      <circle cx="44" cy="30" r="5"/><circle cx="76" cy="20" r="4"/><circle cx="108" cy="34" r="5"/>
      <circle cx="140" cy="24" r="4"/><circle cx="58" cy="62" r="4.5"/><circle cx="96" cy="70" r="5"/>
      <circle cx="132" cy="60" r="4"/><circle cx="40" cy="86" r="4"/><circle cx="150" cy="86" r="4.5"/>
      <circle cx="80" cy="96" r="4"/><circle cx="116" cy="94" r="3.5"/>
    </g>
    <!-- Rodaja de limón encima -->
    <g transform="translate(120 12)">
      <circle cx="0" cy="0" r="24" fill="#FDE047"/>
      <circle cx="0" cy="0" r="18" fill="#FEF08A"/>
      <g stroke="#EAB308" stroke-width="3" opacity=".8">
        <path d="M0-16v32"/><path d="M-16 0h32"/><path d="M-11-11l22 22"/><path d="M11-11l-22 22"/>
      </g>
    </g>
  </g>

  <!-- Papas fritas, en montón y bien separadas de la milanesa -->
  <g transform="translate(286 220)">
    <g fill="#FBBF24" stroke="#D97706" stroke-width="2" stroke-opacity=".5">
      <rect x="0" y="20" width="17" height="62" rx="7" transform="rotate(-24 8 51)"/>
      <rect x="26" y="6" width="17" height="70" rx="7" transform="rotate(-8 34 41)"/>
      <rect x="54" y="0" width="17" height="72" rx="7" transform="rotate(6 62 36)"/>
      <rect x="80" y="10" width="17" height="66" rx="7" transform="rotate(20 88 43)"/>
      <rect x="18" y="52" width="17" height="56" rx="7" transform="rotate(-38 26 80)"/>
      <rect x="62" y="56" width="17" height="54" rx="7" transform="rotate(34 70 83)"/>
    </g>
  </g>

  <!-- Empanada apoyada al frente -->
  <g transform="translate(150 300) rotate(-6)">
    <path d="M0 26c0-17 17-28 38-28s38 11 38 28c0 10-12 17-38 17S0 36 0 26z" fill="#F0C275"/>
    <path d="M0 26c0-17 17-28 38-28s38 11 38 28" fill="none" stroke="#A9762F" stroke-opacity=".55" stroke-width="3"/>
    <path d="M6 19c6 5 6 12 0 17M20 13c6 7 6 16 0 22M38 11c6 7 6 17 0 24M56 13c6 7 6 16 0 22M70 19c6 5 6 12 0 17"
      fill="none" stroke="#A9762F" stroke-width="4" stroke-linecap="round" opacity=".8"/>
  </g>

  <rect y="380" width="480" height="100" fill="#4A1A08" opacity=".42"/>
</svg>
