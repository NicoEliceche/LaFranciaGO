<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" width="480" height="480" role="img">
  <!-- Delivery: moto con la caja de reparto, que es como se reparte acá. -->
  <defs>
    <linearGradient id="del-fondo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0F766E"/>
      <stop offset="1" stop-color="#14B8A6"/>
    </linearGradient>
    <radialGradient id="del-luz" cx="30%" cy="16%" r="70%">
      <stop offset="0" stop-color="#CCFBF1" stop-opacity=".38"/>
      <stop offset="1" stop-color="#CCFBF1" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="480" height="480" fill="url(#del-fondo)"/>
  <rect width="480" height="480" fill="url(#del-luz)"/>

  <!-- Caja de reparto, arriba y bien visible -->
  <g transform="translate(272 136)">
    <rect x="0" y="0" width="120" height="96" rx="12" fill="#F97316"/>
    <rect x="0" y="0" width="120" height="26" rx="12" fill="#FB923C"/>
    <rect x="30" y="34" width="60" height="44" rx="7" fill="#FFF7ED"/>
    <path d="M46 56h28M60 42v28" stroke="#F97316" stroke-width="7" stroke-linecap="round"/>
  </g>

  <!-- Moto -->
  <g>
    <!-- Ruedas -->
    <circle cx="144" cy="318" r="52" fill="#1F2937"/>
    <circle cx="144" cy="318" r="24" fill="#6B7280"/>
    <circle cx="144" cy="318" r="10" fill="#D1D5DB"/>
    <circle cx="350" cy="318" r="52" fill="#1F2937"/>
    <circle cx="350" cy="318" r="24" fill="#6B7280"/>
    <circle cx="350" cy="318" r="10" fill="#D1D5DB"/>

    <!-- Cuerpo -->
    <path d="M144 318l44-74h80l38 74z" fill="#DC2626"/>
    <path d="M186 244h96l-10-34h-70z" fill="#EF4444"/>
    <!-- Asiento -->
    <path d="M206 214h84a14 14 0 0 1 0 28h-84a14 14 0 0 1 0-28z" fill="#1F2937"/>
    <!-- Manubrio -->
    <path d="M166 226l-32-42" stroke="#374151" stroke-width="12" stroke-linecap="round"/>
    <path d="M110 178h48" stroke="#111827" stroke-width="14" stroke-linecap="round"/>
    <!-- Faro -->
    <circle cx="124" cy="206" r="16" fill="#FDE68A"/>
  </g>

  <!-- Movimiento -->
  <g stroke="#CCFBF1" stroke-width="9" stroke-linecap="round" opacity=".55">
    <path d="M40 254h58"/>
    <path d="M28 288h40"/>
  </g>

  <rect y="378" width="480" height="102" fill="#053B37" opacity=".42"/>
</svg>
