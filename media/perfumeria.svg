<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" width="480" height="480" role="img">
  <!-- Perfumería: frasco con vaporizador, crema y jabones. -->
  <defs>
    <linearGradient id="per-fondo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#581C87"/>
      <stop offset="1" stop-color="#A855F7"/>
    </linearGradient>
    <radialGradient id="per-luz" cx="30%" cy="16%" r="70%">
      <stop offset="0" stop-color="#F3E8FF" stop-opacity=".4"/>
      <stop offset="1" stop-color="#F3E8FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="per-jugo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FBCFE8"/>
      <stop offset="1" stop-color="#DB2777"/>
    </linearGradient>
  </defs>

  <rect width="480" height="480" fill="url(#per-fondo)"/>
  <rect width="480" height="480" fill="url(#per-luz)"/>

  <!-- Frasco de perfume, el protagonista -->
  <g transform="translate(174 138)">
    <!-- Vaporizador -->
    <rect x="46" y="-16" width="24" height="26" rx="6" fill="#E9D5FF"/>
    <rect x="38" y="8" width="40" height="18" rx="6" fill="#C4B5FD"/>
    <path d="M70 -8h26a10 10 0 0 1 10 10v10a10 10 0 0 1-10 10H70z" fill="#A78BFA"/>
    <!-- Cuerpo de vidrio -->
    <rect x="8" y="26" width="100" height="150" rx="18" fill="#F5F3FF" opacity=".55"/>
    <rect x="16" y="74" width="84" height="94" rx="12" fill="url(#per-jugo)"/>
    <rect x="8" y="26" width="100" height="150" rx="18" fill="none" stroke="#FFFFFF" stroke-opacity=".5" stroke-width="4"/>
    <path d="M24 44v120" stroke="#FFFFFF" stroke-opacity=".5" stroke-width="8" stroke-linecap="round"/>
    <!-- Etiqueta -->
    <rect x="30" y="104" width="56" height="30" rx="5" fill="#FFFFFF" opacity=".85"/>
  </g>

  <!-- Vaporcito -->
  <g fill="#FFFFFF" opacity=".45">
    <circle cx="300" cy="128" r="6"/>
    <circle cx="322" cy="110" r="4.5"/>
    <circle cx="340" cy="94" r="3.5"/>
  </g>

  <!-- Pote de crema -->
  <g transform="translate(300 250)">
    <rect x="0" y="0" width="94" height="26" rx="10" fill="#FDF4FF"/>
    <path d="M6 24h82a10 10 0 0 1 10 10v54a14 14 0 0 1-14 14H10a14 14 0 0 1-14-14V34a10 10 0 0 1 10-10z" fill="#F0ABFC"/>
    <rect x="12" y="48" width="70" height="24" rx="5" fill="#FFFFFF" opacity=".8"/>
  </g>

  <!-- Jabones apilados -->
  <g transform="translate(102 296)">
    <rect x="0" y="26" width="92" height="30" rx="12" fill="#FDE68A"/>
    <rect x="10" y="0" width="80" height="30" rx="12" fill="#BBF7D0"/>
    <ellipse cx="50" cy="8" rx="26" ry="7" fill="#FFFFFF" opacity=".45"/>
  </g>

  <rect y="376" width="480" height="104" fill="#3B0764" opacity=".42"/>
</svg>
