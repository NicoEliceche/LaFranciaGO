<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" width="480" height="480" role="img">
  <!-- Bebidas: botella de vino, gaseosa y una lata bien fría. -->
  <defs>
    <linearGradient id="beb-fondo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B0764"/>
      <stop offset="1" stop-color="#7E22CE"/>
    </linearGradient>
    <radialGradient id="beb-luz" cx="30%" cy="16%" r="70%">
      <stop offset="0" stop-color="#E9D5FF" stop-opacity=".36"/>
      <stop offset="1" stop-color="#E9D5FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beb-vidrio" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#166534"/>
      <stop offset=".35" stop-color="#22C55E"/>
      <stop offset="1" stop-color="#14532D"/>
    </linearGradient>
  </defs>

  <rect width="480" height="480" fill="url(#beb-fondo)"/>
  <rect width="480" height="480" fill="url(#beb-luz)"/>

  <!-- Botella de vino -->
  <g transform="translate(150 96)">
    <rect x="26" y="0" width="26" height="16" rx="3" fill="#7F1D1D"/>
    <rect x="24" y="14" width="30" height="62" fill="url(#beb-vidrio)"/>
    <path d="M24 70c-16 16-24 34-24 54v122a16 16 0 0 0 16 16h46a16 16 0 0 0 16-16V124c0-20-8-38-24-54z" fill="url(#beb-vidrio)"/>
    <rect x="-2" y="150" width="82" height="66" fill="#FEF3C7"/>
    <g stroke="#B45309" stroke-width="5" stroke-linecap="round" opacity=".8">
      <path d="M12 170h54"/><path d="M12 184h36"/><path d="M12 198h44"/>
    </g>
    <path d="M6 128v120" stroke="#FFFFFF" stroke-opacity=".28" stroke-width="8" stroke-linecap="round"/>
  </g>

  <!-- Gaseosa -->
  <g transform="translate(250 150)">
    <rect x="20" y="-4" width="26" height="18" rx="4" fill="#DC2626"/>
    <path d="M18 14h30c14 12 20 26 20 42v110a14 14 0 0 1-14 14H12a14 14 0 0 1-14-14V56c0-16 6-30 20-42z" fill="#0EA5E9" opacity=".55"/>
    <path d="M-2 92h68v78a14 14 0 0 1-14 14H12a14 14 0 0 1-14-14z" fill="#0369A1" opacity=".8"/>
    <rect x="-2" y="86" width="68" height="34" fill="#FFFFFF" opacity=".85"/>
    <path d="M6 58v110" stroke="#FFFFFF" stroke-opacity=".35" stroke-width="7" stroke-linecap="round"/>
  </g>

  <!-- Lata con gotitas -->
  <g transform="translate(96 248)">
    <rect x="0" y="0" width="70" height="118" rx="12" fill="#E11D48"/>
    <rect x="0" y="0" width="70" height="14" rx="7" fill="#CBD5E1"/>
    <rect x="0" y="40" width="70" height="36" fill="#FFF1F2" opacity=".9"/>
    <g fill="#FFFFFF" opacity=".55">
      <circle cx="14" cy="92" r="4"/><circle cx="34" cy="104" r="3"/><circle cx="56" cy="88" r="3.5"/>
    </g>
  </g>

  <!-- Vaso servido -->
  <g transform="translate(344 268)">
    <path d="M0 0h68l-10 96a12 12 0 0 1-12 10H22a12 12 0 0 1-12-10z" fill="#FFFFFF" opacity=".28"/>
    <path d="M4 40h60l-6 56a12 12 0 0 1-12 10H22a12 12 0 0 1-12-10z" fill="#FBBF24" opacity=".9"/>
    <g fill="#FFFFFF" opacity=".5">
      <circle cx="24" cy="54" r="4"/><circle cx="42" cy="62" r="3"/><circle cx="32" cy="74" r="3.5"/>
    </g>
  </g>

  <rect y="368" width="480" height="112" fill="#2A0845" opacity=".45"/>
</svg>
