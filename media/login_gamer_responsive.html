<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#06101F" />
  <meta name="color-scheme" content="dark" />
  <title>Ingreso | Fly</title>

  <style>
    :root {
      --brand: #0042D6;
      --brand-2: #2A7BFF;
      --brand-soft: rgba(0, 66, 214, 0.18);

      --bg: #040913;
      --bg-2: #071225;
      --panel: rgba(8, 17, 34, 0.78);
      --panel-strong: rgba(9, 20, 42, 0.94);

      --text: #F8FBFF;
      --muted: #A9B5C7;
      --line: rgba(255, 255, 255, 0.10);
      --line-strong: rgba(255, 255, 255, 0.18);

      --success: #4ADE80;
      --danger: #FF6B7A;

      --radius-xl: 28px;
      --radius-lg: 18px;
      --radius-md: 14px;

      --shadow:
        0 28px 90px rgba(0, 0, 0, 0.48),
        0 0 0 1px rgba(255,255,255,0.04) inset;

      --ease: cubic-bezier(.22, 1, .36, 1);
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-width: 320px;
      background: var(--bg);
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 20% 15%, rgba(0, 66, 214, 0.34), transparent 34%),
        radial-gradient(circle at 80% 82%, rgba(34, 113, 255, 0.16), transparent 30%),
        linear-gradient(135deg, #030711 0%, #071124 52%, #020611 100%);
      overflow-x: hidden;
    }

    button,
    input {
      font: inherit;
    }

    a {
      color: inherit;
    }

    .app-shell {
      position: relative;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px 20px;
      isolation: isolate;
      overflow: hidden;
    }

    /* Fondo gamer sutil: no interfiere con la legibilidad */
    .ambient {
      position: absolute;
      inset: 0;
      z-index: -3;
      pointer-events: none;
      overflow: hidden;
    }

    .ambient::before,
    .ambient::after {
      content: "";
      position: absolute;
      width: 520px;
      height: 520px;
      border-radius: 50%;
      filter: blur(28px);
      opacity: 0.26;
      animation: float-orb 14s var(--ease) infinite alternate;
    }

    .ambient::before {
      left: -180px;
      top: -160px;
      background: radial-gradient(circle, rgba(0, 66, 214, 0.90), transparent 68%);
    }

    .ambient::after {
      right: -200px;
      bottom: -180px;
      background: radial-gradient(circle, rgba(71, 129, 255, 0.55), transparent 68%);
      animation-delay: -5s;
    }

    .grid-overlay {
      position: absolute;
      inset: 0;
      z-index: -2;
      pointer-events: none;
      opacity: 0.16;
      background-image:
        linear-gradient(rgba(255,255,255,.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.05) 1px, transparent 1px);
      background-size: 34px 34px;
      mask-image: radial-gradient(circle at center, black 28%, transparent 82%);
    }

    .light-beam {
      position: absolute;
      z-index: -1;
      width: 70vw;
      max-width: 900px;
      height: 220px;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%) rotate(-16deg);
      background: linear-gradient(
        90deg,
        transparent 0%,
        rgba(0, 66, 214, 0.08) 25%,
        rgba(0, 66, 214, 0.22) 50%,
        rgba(0, 66, 214, 0.08) 75%,
        transparent 100%
      );
      filter: blur(14px);
      animation: beam-pulse 7s ease-in-out infinite;
      pointer-events: none;
    }

    .login-card {
      width: min(100%, 470px);
      position: relative;
      padding: 28px;
      border-radius: var(--radius-xl);
      border: 1px solid rgba(255, 255, 255, 0.11);
      background:
        linear-gradient(180deg, rgba(255,255,255,0.025), transparent 30%),
        var(--panel);
      box-shadow: var(--shadow);
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
      animation: card-enter 700ms var(--ease) both;
    }

    .login-card::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      pointer-events: none;
      padding: 1px;
      background: linear-gradient(
        145deg,
        rgba(88, 143, 255, .55),
        rgba(255,255,255,.08) 30%,
        transparent 62%,
        rgba(0,66,214,.36)
      );
      -webkit-mask:
        linear-gradient(#fff 0 0) content-box,
        linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 24px;
    }

    .brand-mark {
      width: 66px;
      height: 66px;
      flex: 0 0 auto;
      border-radius: 18px;
      display: grid;
      place-items: center;
      background: rgba(0, 66, 214, 0.14);
      border: 1px solid rgba(82, 142, 255, 0.28);
      box-shadow:
        0 12px 28px rgba(0, 66, 214, 0.16),
        inset 0 0 20px rgba(0, 66, 214, 0.06);
    }

    .brand-mark img {
      width: 54px;
      height: 54px;
      display: block;
      object-fit: contain;
      filter: drop-shadow(0 5px 16px rgba(0, 66, 214, 0.24));
    }

    .brand-copy {
      min-width: 0;
    }

    .eyebrow {
      margin: 0 0 5px;
      color: #8CB1FF;
      font-size: 0.76rem;
      font-weight: 800;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.65rem, 4vw, 2rem);
      line-height: 1.05;
      letter-spacing: -0.035em;
    }

    .intro {
      margin: 10px 0 0;
      color: var(--muted);
      font-size: 0.94rem;
      line-height: 1.55;
    }

    .account-type {
      margin: 24px 0 22px;
    }

    .section-label {
      display: block;
      margin-bottom: 10px;
      color: #E9F0FB;
      font-size: 0.84rem;
      font-weight: 700;
    }

    .role-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .role-option {
      position: relative;
      min-width: 0;
    }

    .role-option input {
      position: absolute;
      inset: 0;
      opacity: 0;
      pointer-events: none;
    }

    .role-option label {
      min-height: 52px;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 13px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: rgba(255,255,255,0.035);
      color: #DCE5F3;
      cursor: pointer;
      user-select: none;
      transition:
        border-color 180ms ease,
        background 180ms ease,
        transform 180ms ease,
        color 180ms ease,
        box-shadow 180ms ease;
    }

    .role-icon {
      width: 28px;
      height: 28px;
      border-radius: 9px;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      background: rgba(255,255,255,.045);
      border: 1px solid rgba(255,255,255,.07);
      color: #BFD0EE;
      font-size: 0.78rem;
      font-weight: 800;
    }

    .role-option input:checked + label {
      color: #FFFFFF;
      border-color: rgba(67, 129, 255, 0.82);
      background:
        linear-gradient(180deg, rgba(0,66,214,.24), rgba(0,66,214,.13));
      box-shadow:
        inset 0 0 0 1px rgba(104, 154, 255, 0.12),
        0 8px 24px rgba(0, 66, 214, 0.12);
    }

    .role-option input:checked + label .role-icon {
      background: var(--brand);
      color: white;
      border-color: rgba(255,255,255,.16);
    }

    .role-option input:focus-visible + label {
      outline: 3px solid rgba(103, 158, 255, 0.46);
      outline-offset: 3px;
    }

    .form {
      display: grid;
      gap: 16px;
    }

    .field {
      display: grid;
      gap: 8px;
    }

    .field-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
    }

    .field label {
      color: #E9F0FB;
      font-size: 0.84rem;
      font-weight: 700;
    }

    .field a {
      color: #8FB5FF;
      font-size: 0.80rem;
      font-weight: 650;
      text-decoration: none;
    }

    .input-wrap {
      position: relative;
    }

    .input-wrap svg {
      position: absolute;
      top: 50%;
      left: 15px;
      width: 19px;
      height: 19px;
      transform: translateY(-50%);
      color: #6F7F96;
      pointer-events: none;
    }

    .field input {
      width: 100%;
      min-height: 52px;
      padding: 0 15px 0 45px;
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      outline: none;
      color: var(--text);
      caret-color: #8FB5FF;
      background: rgba(2, 8, 19, 0.58);
      transition:
        border-color 170ms ease,
        background 170ms ease,
        box-shadow 170ms ease;
    }

    .field input::placeholder {
      color: #66758A;
    }

    .field input:focus {
      border-color: rgba(82, 142, 255, 0.76);
      background: rgba(3, 10, 24, 0.78);
      box-shadow: 0 0 0 4px rgba(0, 66, 214, 0.15);
    }

    .field input:invalid:not(:placeholder-shown) {
      border-color: rgba(255, 107, 122, 0.68);
    }

    .submit {
      min-height: 54px;
      border: 0;
      border-radius: 15px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 0 18px;
      color: #FFFFFF;
      font-weight: 800;
      letter-spacing: -0.01em;
      cursor: pointer;
      background:
        linear-gradient(135deg, #0A55FF 0%, var(--brand) 48%, #002E9B 100%);
      box-shadow:
        0 14px 34px rgba(0, 66, 214, 0.28),
        inset 0 1px 0 rgba(255,255,255,.19);
      transition:
        transform 180ms ease,
        box-shadow 180ms ease,
        filter 180ms ease;
    }

    .submit:focus-visible {
      outline: 3px solid rgba(125, 172, 255, 0.72);
      outline-offset: 4px;
    }

    .submit:active {
      transform: translateY(1px) scale(.995);
    }

    .submit svg {
      width: 19px;
      height: 19px;
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      color: #708097;
      font-size: 0.76rem;
      margin: 4px 0 0;
    }

    .divider::before,
    .divider::after {
      content: "";
      height: 1px;
      flex: 1;
      background: var(--line);
    }

    .footer-note {
      margin: 0;
      text-align: center;
      color: var(--muted);
      font-size: 0.84rem;
      line-height: 1.55;
    }

    .footer-note a {
      color: #A7C4FF;
      font-weight: 700;
      text-decoration: none;
    }

    .security-note {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 18px;
      color: #73849A;
      font-size: 0.74rem;
    }

    .security-note svg {
      width: 15px;
      height: 15px;
    }

    @media (hover: hover) and (pointer: fine) {
      .role-option label:hover {
        transform: translateY(-1px);
        border-color: rgba(255,255,255,.20);
        background: rgba(255,255,255,.055);
      }

      .field a:hover,
      .footer-note a:hover {
        text-decoration: underline;
      }

      .submit:hover {
        transform: translateY(-1px);
        filter: brightness(1.06);
        box-shadow:
          0 18px 40px rgba(0, 66, 214, 0.34),
          inset 0 1px 0 rgba(255,255,255,.22);
      }
    }

    @media (max-width: 520px) {
      .app-shell {
        padding: 18px 14px;
        align-items: center;
      }

      .login-card {
        padding: 22px 18px;
        border-radius: 24px;
      }

      .brand {
        margin-bottom: 20px;
      }

      .brand-mark {
        width: 58px;
        height: 58px;
        border-radius: 16px;
      }

      .brand-mark img {
        width: 48px;
        height: 48px;
      }

      .role-grid {
        grid-template-columns: 1fr 1fr;
      }

      .role-option label {
        padding: 11px;
      }
    }

    @media (max-width: 370px) {
      .role-grid {
        grid-template-columns: 1fr;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }

    @keyframes card-enter {
      from {
        opacity: 0;
        transform: translateY(18px) scale(.985);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes float-orb {
      from {
        transform: translate3d(0, 0, 0) scale(1);
      }
      to {
        transform: translate3d(36px, 24px, 0) scale(1.08);
      }
    }

    @keyframes beam-pulse {
      0%, 100% {
        opacity: .55;
      }
      50% {
        opacity: .95;
      }
    }
  </style>
</head>

              <path d="M12 14v2" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
            </svg>
            <input
              id="password"
              name="password"
              type="password"
              autocomplete="current-password"
              placeholder="Ingresá tu contraseña"
              minlength="6"
              required
            />
          </div>
        </div>

        <button class="submit" type="submit">
          <span>Ingresar</span>
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M5 12h13" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            <path d="m14 7 5 5-5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>

        <div class="divider" aria-hidden="true">NUEVO EN LA APP</div>

        <p class="footer-note">
          ¿Todavía no tenés cuenta?
          <a href="/registro">Crear una cuenta</a>
        </p>
      </form>

      <div class="security-note">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M12 3 5 6v5c0 4.6 2.8 8.5 7 10 4.2-1.5 7-5.4 7-10V6l-7-3Z" stroke="currentColor" stroke-width="1.6"/>
          <path d="m9.5 12 1.7 1.7 3.6-3.8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span>Conexión segura · Tus datos están protegidos</span>
      </div>
    </section>
  </main>
</body>
</html>
