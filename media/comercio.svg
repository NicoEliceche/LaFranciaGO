<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" width="480" height="480" role="img">
  <!-- Comercio: el que se usa cuando el rubro no tiene arte propia, así que
       es un local de pueblo genérico y no un producto puntual: toldo a
       rayas, vidriera y puerta abierta. -->
  <defs>
    <linearGradient id="com-fondo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1E3A8A"/>
      <stop offset="1" stop-color="#3B82F6"/>
    </linearGradient>
    <radialGradient id="com-luz" cx="30%" cy="16%" r="70%">
      <stop offset="0" stop-color="#DBEAFE" stop-opacity=".38"/>
      <stop offset="1" stop-color="#DBEAFE" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="com-vidrio" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#BFDBFE"/>
      <stop offset="1" stop-color="#60A5FA"/>
    </linearGradient>
  </defs>

  <rect width="480" height="480" fill="url(#com-fondo)"/>
  <rect width="480" height="480" fill="url(#com-luz)"/>

  <!-- Cuerpo del local -->
  <rect x="94" y="176" width="292" height="196" rx="10" fill="#F8FAFC"/>
  <rect x="94" y="176" width="292" height="196" rx="10" fill="#E2E8F0" opacity=".6"/>

  <!-- Toldo a rayas -->
  <g>
    <path d="M84 176h312l-16-52H100z" fill="#DC2626"/>
    <g fill="#FEF2F2">
      <path d="M128 124h34l8 52h-34z"/>
      <path d="M196 124h34l4 52h-34z"/>
      <path d="M264 124h34l0 52h-34z"/>
      <path d="M332 124h26l8 52h-30z"/>
    </g>
    <path d="M84 176h312v12H84z" fill="#B91C1C"/>
  </g>

  <!-- Vidriera -->
  <g>
    <rect x="118" y="206" width="112" height="98" rx="6" fill="url(#com-vidrio)"/>
    <path d="M118 206l112 98" stroke="#FFFFFF" stroke-opacity=".45" stroke-width="10"/>
    <rect x="118" y="206" width="112" height="98" rx="6" fill="none" stroke="#94A3B8" stroke-width="5"/>
    <!-- Algo exhibido adentro -->
    <rect x="136" y="262" width="26" height="34" rx="4" fill="#F59E0B"/>
    <circle cx="188" cy="278" r="17" fill="#22C55E"/>
  </g>

  <!-- Puerta abierta -->
  <g>
    <rect x="256" y="216" width="94" height="156" rx="6" fill="#1D4ED8"/>
    <rect x="266" y="228" width="74" height="76" rx="5" fill="#93C5FD" opacity=".8"/>
    <circle cx="336" cy="300" r="6" fill="#FDE68A"/>
  </g>

  <!-- Cartel -->
  <rect x="150" y="330" width="96" height="22" rx="7" fill="#0F172A" opacity=".25"/>

  <!-- Vereda -->
  <rect x="70" y="372" width="340" height="14" rx="7" fill="#CBD5E1" opacity=".5"/>

  <rect y="380" width="480" height="100" fill="#0C1F52" opacity=".42"/>
</svg>
