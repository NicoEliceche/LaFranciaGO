<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" width="480" height="480" role="img">
  <!-- Farmacia: cruz verde, frasco de remedio y blíster de pastillas. -->
  <defs>
    <linearGradient id="far-fondo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#064E3B"/>
      <stop offset="1" stop-color="#059669"/>
    </linearGradient>
    <radialGradient id="far-luz" cx="30%" cy="16%" r="70%">
      <stop offset="0" stop-color="#A7F3D0" stop-opacity=".36"/>
      <stop offset="1" stop-color="#A7F3D0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="480" height="480" fill="url(#far-fondo)"/>
  <rect width="480" height="480" fill="url(#far-luz)"/>

  <!-- Cruz de farmacia, el símbolo que se reconoce de lejos -->
  <g transform="translate(240 176)">
    <path d="M-30-76h60v46h46v60h-46v46h-60v-46h-46v-60h46z" fill="#ECFDF5"/>
    <path d="M-30-76h60v46h46v18h-106z" fill="#FFFFFF" opacity=".5"/>
  </g>

  <!-- Frasco de jarabe -->
  <g transform="translate(112 252)">
    <rect x="22" y="-16" width="26" height="20" rx="5" fill="#0F766E"/>
    <path d="M6 4h58a16 16 0 0 1 16 16v82a16 16 0 0 1-16 16H6a16 16 0 0 1-16-16V20A16 16 0 0 1 6 4z" fill="#D1FAE5"/>
    <path d="M-10 62h96v40a16 16 0 0 1-16 16H6a16 16 0 0 1-16-16z" fill="#34D399"/>
    <rect x="2" y="26" width="66" height="28" rx="5" fill="#FFFFFF" opacity=".85"/>
    <g stroke="#059669" stroke-width="4" stroke-linecap="round" opacity=".7">
      <path d="M12 36h46"/><path d="M12 46h30"/>
    </g>
  </g>

  <!-- Blíster de pastillas -->
  <g transform="translate(276 274) rotate(-8)">
    <rect x="0" y="0" width="120" height="76" rx="12" fill="#E2E8F0"/>
    <g fill="#FFFFFF">
      <circle cx="26" cy="24" r="12"/><circle cx="60" cy="24" r="12"/><circle cx="94" cy="24" r="12"/>
      <circle cx="26" cy="52" r="12"/><circle cx="60" cy="52" r="12"/><circle cx="94" cy="52" r="12"/>
    </g>
    <g fill="#94A3B8" opacity=".5">
      <circle cx="26" cy="24" r="6"/><circle cx="60" cy="24" r="6"/><circle cx="94" cy="24" r="6"/>
      <circle cx="26" cy="52" r="6"/><circle cx="60" cy="52" r="6"/><circle cx="94" cy="52" r="6"/>
    </g>
  </g>

  <!-- Dos cápsulas sueltas -->
  <g transform="translate(200 346) rotate(24)">
    <rect x="0" y="0" width="56" height="22" rx="11" fill="#FBBF24"/>
    <path d="M28 0h17a11 11 0 0 1 0 22H28z" fill="#EF4444"/>
  </g>

  <rect y="368" width="480" height="112" fill="#022C22" opacity=".45"/>
</svg>
