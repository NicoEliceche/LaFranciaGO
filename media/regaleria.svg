<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" width="480" height="480" role="img">
  <!-- Regalería: cajas de regalo con moño, globos y una tarjeta. -->
  <defs>
    <linearGradient id="reg-fondo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#854D0E"/>
      <stop offset="1" stop-color="#EAB308"/>
    </linearGradient>
    <radialGradient id="reg-luz" cx="30%" cy="16%" r="70%">
      <stop offset="0" stop-color="#FEF9C3" stop-opacity=".4"/>
      <stop offset="1" stop-color="#FEF9C3" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="480" height="480" fill="url(#reg-fondo)"/>
  <rect width="480" height="480" fill="url(#reg-luz)"/>

  <!-- Globos -->
  <g>
    <path d="M132 152c0 24-14 40-30 40s-30-16-30-40 14-42 30-42 30 18 30 42z" fill="#EF4444"/>
    <path d="M102 192l6 18" stroke="#FEF3C7" stroke-width="4" stroke-linecap="round"/>
    <path d="M380 140c0 22-13 36-27 36s-27-14-27-36 13-38 27-38 27 16 27 38z" fill="#38BDF8"/>
    <path d="M353 176l-6 18" stroke="#FEF3C7" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Caja grande con moño -->
  <g transform="translate(150 210)">
    <rect x="0" y="46" width="180" height="120" rx="10" fill="#DC2626"/>
    <rect x="-10" y="28" width="200" height="34" rx="10" fill="#EF4444"/>
    <rect x="74" y="28" width="32" height="138" fill="#FDE68A"/>
    <rect x="-10" y="38" width="200" height="14" fill="#FDE68A"/>
    <!-- Moño -->
    <path d="M90 28c-26-16-52-10-52 6 0 12 22 16 52 2z" fill="#FBBF24"/>
    <path d="M90 28c26-16 52-10 52 6 0 12-22 16-52 2z" fill="#FBBF24"/>
    <circle cx="90" cy="30" r="12" fill="#F59E0B"/>
  </g>

  <!-- Caja chica al costado -->
  <g transform="translate(78 274)">
    <rect x="0" y="22" width="86" height="76" rx="8" fill="#7C3AED"/>
    <rect x="-6" y="10" width="98" height="22" rx="8" fill="#8B5CF6"/>
    <rect x="34" y="10" width="18" height="88" fill="#EDE9FE"/>
    <path d="M43 10c-14-10-28-6-28 4 0 7 12 9 28 1z" fill="#EDE9FE"/>
    <path d="M43 10c14-10 28-6 28 4 0 7-12 9-28 1z" fill="#EDE9FE"/>
  </g>

  <!-- Tarjetita -->
  <g transform="translate(330 318) rotate(-10)">
    <rect x="0" y="0" width="76" height="52" rx="6" fill="#FFF7ED"/>
    <g stroke="#B45309" stroke-width="4" stroke-linecap="round" opacity=".6">
      <path d="M12 18h52"/><path d="M12 30h36"/>
    </g>
    <path d="M56 40l8 8 12-16" fill="none" stroke="#DC2626" stroke-width="5" stroke-linecap="round"/>
  </g>

  <rect y="376" width="480" height="104" fill="#4A2D05" opacity=".42"/>
</svg>
