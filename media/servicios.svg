<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" width="480" height="480" role="img">
  <!-- Servicios: oficios del pueblo. Un par de manos con una llave y un
       engranaje: el rubro no es un producto que se pueda dibujar, así que se
       muestra el trabajo. -->
  <defs>
    <linearGradient id="ser-fondo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0C4A6E"/>
      <stop offset="1" stop-color="#0284C7"/>
    </linearGradient>
    <radialGradient id="ser-luz" cx="30%" cy="16%" r="70%">
      <stop offset="0" stop-color="#BAE6FD" stop-opacity=".38"/>
      <stop offset="1" stop-color="#BAE6FD" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ser-metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F1F5F9"/>
      <stop offset="1" stop-color="#94A3B8"/>
    </linearGradient>
  </defs>

  <rect width="480" height="480" fill="url(#ser-fondo)"/>
  <rect width="480" height="480" fill="url(#ser-luz)"/>

  <!-- Engranaje grande -->
  <g transform="translate(240 224)">
    <g fill="#E2E8F0">
      <circle cx="0" cy="0" r="86"/>
      <g>
        <rect x="-16" y="-116" width="32" height="34" rx="6"/>
        <rect x="-16" y="82" width="32" height="34" rx="6"/>
        <rect x="-116" y="-16" width="34" height="32" rx="6"/>
        <rect x="82" y="-16" width="34" height="32" rx="6"/>
        <rect x="-16" y="-116" width="32" height="34" rx="6" transform="rotate(45)"/>
        <rect x="-16" y="82" width="32" height="34" rx="6" transform="rotate(45)"/>
        <rect x="-116" y="-16" width="34" height="32" rx="6" transform="rotate(45)"/>
        <rect x="82" y="-16" width="34" height="32" rx="6" transform="rotate(45)"/>
      </g>
    </g>
    <circle cx="0" cy="0" r="86" fill="none" stroke="#94A3B8" stroke-opacity=".5" stroke-width="4"/>
    <circle cx="0" cy="0" r="38" fill="#0284C7"/>
    <circle cx="0" cy="0" r="38" fill="none" stroke="#94A3B8" stroke-width="6"/>
  </g>

  <!-- Llave inglesa cruzada adelante -->
  <g transform="translate(96 268) rotate(-28)">
    <rect x="0" y="30" width="200" height="26" rx="12" fill="url(#ser-metal)"/>
    <path d="M-6 18h34a22 22 0 0 1 0 44H-6a26 26 0 0 1 0-44z" fill="#CBD5E1"/>
    <path d="M2 30h22v16H2z" fill="#0F172A" opacity=".6"/>
    <path d="M206 30h26a20 20 0 0 1 0 26h-26z" fill="#CBD5E1"/>
  </g>

  <!-- Destornillador cruzado -->
  <g transform="translate(298 306) rotate(34)">
    <rect x="0" y="0" width="66" height="22" rx="9" fill="#F59E0B"/>
    <rect x="64" y="6" width="58" height="10" rx="5" fill="#CBD5E1"/>
    <rect x="120" y="4" width="14" height="14" rx="3" fill="#94A3B8"/>
  </g>

  <rect y="376" width="480" height="104" fill="#062A42" opacity=".45"/>
</svg>
