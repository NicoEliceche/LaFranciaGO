<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" width="480" height="480" role="img">
  <!-- Indumentaria: perchero con remera, camisa y un jean doblado. -->
  <defs>
    <linearGradient id="ind-fondo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#312E81"/>
      <stop offset="1" stop-color="#6366F1"/>
    </linearGradient>
    <radialGradient id="ind-luz" cx="30%" cy="16%" r="70%">
      <stop offset="0" stop-color="#C7D2FE" stop-opacity=".36"/>
      <stop offset="1" stop-color="#C7D2FE" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="480" height="480" fill="url(#ind-fondo)"/>
  <rect width="480" height="480" fill="url(#ind-luz)"/>

  <!-- Barral -->
  <path d="M66 126h348" stroke="#CBD5E1" stroke-width="10" stroke-linecap="round"/>

  <!-- Percha + remera -->
  <g transform="translate(112 126)">
    <path d="M44 0v16" stroke="#94A3B8" stroke-width="5"/>
    <path d="M44 16l-34 24h68z" fill="none" stroke="#94A3B8" stroke-width="5" stroke-linejoin="round"/>
    <path d="M10 44h68l26 22-16 24-14-10v92H14v-92L0 90-16 66z" fill="#F43F5E"/>
    <path d="M30 44h28c0 10-6 16-14 16s-14-6-14-16z" fill="#BE123C" opacity=".6"/>
  </g>

  <!-- Percha + camisa -->
  <g transform="translate(252 126)">
    <path d="M44 0v16" stroke="#94A3B8" stroke-width="5"/>
    <path d="M44 16l-34 24h68z" fill="none" stroke="#94A3B8" stroke-width="5" stroke-linejoin="round"/>
    <path d="M10 44h68l24 20-14 22-12-8v94H12v-94l-12 8L-14 64z" fill="#E0F2FE"/>
    <path d="M32 44h24l-12 20z" fill="#BAE6FD"/>
    <path d="M44 64v108" stroke="#94A3B8" stroke-opacity=".5" stroke-width="3"/>
    <g fill="#94A3B8" opacity=".7">
      <circle cx="44" cy="96" r="3.5"/><circle cx="44" cy="126" r="3.5"/><circle cx="44" cy="156" r="3.5"/>
    </g>
  </g>

  <!-- Jean doblado abajo -->
  <g transform="translate(150 316)">
    <rect x="0" y="0" width="180" height="46" rx="10" fill="#1D4ED8"/>
    <rect x="0" y="0" width="180" height="14" rx="7" fill="#3B82F6"/>
    <path d="M0 24h180" stroke="#F59E0B" stroke-opacity=".7" stroke-width="3" stroke-dasharray="9 7"/>
    <rect x="18" y="30" width="30" height="10" rx="4" fill="#1E40AF"/>
  </g>

  <rect y="376" width="480" height="104" fill="#1B1650" opacity=".42"/>
</svg>
