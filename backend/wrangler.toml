name = "lafranciago-api"
main = "src/index.ts"
compatibility_date = "2026-09-01"

# Hay dos bases: la de todos los dias y la que va a usar la gente.
#
#   lafranciago        desarrollo y pruebas (la de siempre, con datos de prueba)
#   lafranciago-prod   produccion, limpia
#
# Sin --env se trabaja contra la de desarrollo, que es lo que uno quiere el
# 99% de las veces. Para produccion hay que pedirlo:
#
#   npx wrangler deploy --env prod
#   npx wrangler d1 migrations apply lafranciago-prod --remote --env prod
#
# El bucket y las variables se comparten; lo unico que cambia es la base.
# Los secretos son por entorno: los de produccion se cargan con
#   npx wrangler secret put NOMBRE --env prod

[[d1_databases]]
binding = "DB"
database_name = "lafranciago"
database_id = "76f9f320-492e-4be8-ba5c-8bea0eeed09a"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "lafranciago-media"

[vars]
# Orígenes que pueden llamar a la API. Sin comodín: con credenciales, un "*"
# dejaría que cualquier sitio leyera los datos del usuario.
ORIGENES_PERMITIDOS = "https://nicoeliceche.github.io,http://localhost:8081"
# A dónde vuelve el usuario al terminar el ingreso con Google. Es el origen,
# sin ruta: el ingreso con Google compara orígenes, no direcciones completas.
APP_URL = "https://nicoeliceche.github.io"
# La dirección donde vive la app, con su subcarpeta. Los enlaces que se mandan
# por correo se arman con esto: con sólo el origen, el de recuperar contraseña
# apuntaba a la raíz del dominio y daba 404.
APP_PUBLIC_URL = "https://nicoeliceche.github.io/LaFranciaGO"
# Dirección de esta misma API. Mercado Pago la usa para avisar cómo salió cada
# pago, y para devolver al comercio después de conectar su cuenta.
API_PUBLIC_URL = "https://lafranciago-api.lafranciago-api.workers.dev"

# Las credenciales de Google NO van acá: son secretos y este archivo se sube
# al repositorio. Se cargan una sola vez con:
#   npx wrangler secret put GOOGLE_CLIENT_ID
#   npx wrangler secret put GOOGLE_CLIENT_SECRET
#
# Lo mismo para el correo y para Mercado Pago:
#   npx wrangler secret put RESEND_API_KEY
#   npx wrangler secret put MP_ACCESS_TOKEN
#   npx wrangler secret put MP_CLIENT_ID
#   npx wrangler secret put MP_CLIENT_SECRET

# Entorno local para desarrollo: usa una copia de la base en disco.
[env.dev]
vars = { ORIGENES_PERMITIDOS = "http://localhost:8081" }

# ── Produccion ──
# Hereda todo lo de arriba salvo lo que se repita aca.

[env.prod]
name = "lafranciago-api-prod"

[[env.prod.d1_databases]]
binding = "DB"
database_name = "lafranciago-prod"
database_id = "bdf40919-b910-4611-8f6e-a407f4f29afa"

[[env.prod.r2_buckets]]
binding = "MEDIA"
bucket_name = "lafranciago-media"
