name = "lafranciago-api"
main = "src/index.ts"
compatibility_date = "2026-09-01"

# La base y el bucket se crean con:
#   npx wrangler d1 create lafranciago
#   npx wrangler r2 bucket create lafranciago-media
# y después se pega acá el database_id que devuelve el primer comando.

[[d1_databases]]
binding = "DB"
database_name = "lafranciago"
database_id = "76f9f320-492e-4be8-ba5c-8bea0eeed09a"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "lafranciago-media"

[vars]
# Orígenes que pueden llamar a la API. Sin comodín: con credenciales, un "*"
# dejaría que cualquier sitio leyera los datos del usuario.
ORIGENES_PERMITIDOS = "https://nicoeliceche.github.io,http://localhost:8081"
# A dónde vuelve el usuario al terminar el ingreso con Google. Es el origen,
# sin ruta: el ingreso con Google compara orígenes, no direcciones completas.
APP_URL = "https://nicoeliceche.github.io"
# La dirección donde vive la app, con su subcarpeta. Los enlaces que se mandan
# por correo se arman con esto: con sólo el origen, el de recuperar contraseña
# apuntaba a la raíz del dominio y daba 404.
APP_PUBLIC_URL = "https://nicoeliceche.github.io/LaFranciaGO"

# Las credenciales de Google NO van acá: son secretos y este archivo se sube
# al repositorio. Se cargan una sola vez con:
#   npx wrangler secret put GOOGLE_CLIENT_ID
#   npx wrangler secret put GOOGLE_CLIENT_SECRET

# Entorno local para desarrollo: usa una copia de la base en disco.
[env.dev]
vars = { ORIGENES_PERMITIDOS = "http://localhost:8081" }
