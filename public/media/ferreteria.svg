<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" width="480" height="480" role="img">
  <!-- Ferretería: caja de herramientas con martillo, llave y destornillador. -->
  <defs>
    <linearGradient id="fer-fondo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#334155"/>
      <stop offset="1" stop-color="#64748B"/>
    </linearGradient>
    <radialGradient id="fer-luz" cx="30%" cy="16%" r="70%">
      <stop offset="0" stop-color="#E2E8F0" stop-opacity=".36"/>
      <stop offset="1" stop-color="#E2E8F0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fer-metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F1F5F9"/>
      <stop offset="1" stop-color="#94A3B8"/>
    </linearGradient>
  </defs>

  <rect width="480" height="480" fill="url(#fer-fondo)"/>
  <rect width="480" height="480" fill="url(#fer-luz)"/>

  <!-- Llave inglesa, en diagonal atrás -->
  <g transform="translate(300 118) rotate(38)">
    <rect x="0" y="34" width="150" height="26" rx="12" fill="url(#fer-metal)"/>
    <path d="M-6 22h34a22 22 0 0 1 0 44H-6a26 26 0 0 1 0-44z" fill="#CBD5E1"/>
    <path d="M2 34h22v16H2z" fill="#475569"/>
  </g>

  <!-- Martillo -->
  <g transform="translate(112 130) rotate(-24)">
    <rect x="20" y="40" width="26" height="150" rx="10" fill="#B45309"/>
    <path d="M-10 6h82a12 12 0 0 1 12 12v22a12 12 0 0 1-12 12H-10a14 14 0 0 1 0-46z" fill="#E2E8F0"/>
    <path d="M56 6h16l14 16-14 16H56z" fill="#94A3B8"/>
  </g>

  <!-- Caja de herramientas -->
  <g>
    <path d="M104 270h272a12 12 0 0 1 12 12v90a12 12 0 0 1-12 12H104a12 12 0 0 1-12-12v-90a12 12 0 0 1 12-12z" fill="#DC2626"/>
    <rect x="92" y="270" width="296" height="20" rx="8" fill="#EF4444"/>
    <path d="M196 270c0-22 18-36 44-36s44 14 44 36" fill="none" stroke="#7F1D1D" stroke-width="12"/>
    <rect x="92" y="316" width="296" height="10" fill="#B91C1C" opacity=".7"/>
  </g>

  <!-- Destornillador y tornillos apoyados adelante -->
  <g transform="translate(150 340) rotate(-6)">
    <rect x="0" y="0" width="62" height="20" rx="8" fill="#F59E0B"/>
    <rect x="60" y="6" width="54" height="8" rx="4" fill="#CBD5E1"/>
    <rect x="112" y="4" width="14" height="12" rx="3" fill="#94A3B8"/>
  </g>
  <g fill="#E2E8F0" opacity=".85">
    <circle cx="320" cy="348" r="9"/>
    <circle cx="346" cy="358" r="7"/>
  </g>

  <rect y="378" width="480" height="102" fill="#111827" opacity=".42"/>
</svg>
