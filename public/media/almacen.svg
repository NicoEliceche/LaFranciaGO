<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" width="480" height="480" role="img">
  <!-- Almacén: estante con la compra del día, bolsa de papel y fideos. -->
  <defs>
    <linearGradient id="alm-fondo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1E3A8A"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
    <radialGradient id="alm-luz" cx="30%" cy="16%" r="70%">
      <stop offset="0" stop-color="#BFDBFE" stop-opacity=".36"/>
      <stop offset="1" stop-color="#BFDBFE" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="480" height="480" fill="url(#alm-fondo)"/>
  <rect width="480" height="480" fill="url(#alm-luz)"/>

  <!-- Estante de atrás con latas -->
  <g>
    <rect x="72" y="188" width="336" height="10" rx="5" fill="#1E40AF" opacity=".8"/>
    <g>
      <rect x="96" y="132" width="46" height="56" rx="7" fill="#DC2626"/>
      <rect x="96" y="146" width="46" height="16" fill="#FEF3C7" opacity=".9"/>
      <rect x="150" y="142" width="42" height="46" rx="7" fill="#16A34A"/>
      <rect x="150" y="154" width="42" height="14" fill="#DCFCE7" opacity=".85"/>
      <rect x="200" y="136" width="44" height="52" rx="7" fill="#F59E0B"/>
      <rect x="200" y="150" width="44" height="15" fill="#FFFBEB" opacity=".85"/>
    </g>
    <!-- Botella de aceite -->
    <g transform="translate(266 116)">
      <rect x="14" y="0" width="14" height="22" rx="4" fill="#65A30D"/>
      <path d="M8 22h26c6 10 10 22 10 34v32H-2V56c0-12 4-24 10-34z" fill="#84CC16"/>
      <rect x="-2" y="58" width="46" height="18" fill="#FEF9C3" opacity=".9"/>
    </g>
  </g>

  <!-- Bolsa de papel con la compra -->
  <g>
    <path d="M136 244h136l16 132H120z" fill="#D9A066"/>
    <path d="M136 244h136l4 26H132z" fill="#EFC08A"/>
    <path d="M160 244c0-16 16-26 44-26s44 10 44 26" fill="none" stroke="#B37F45" stroke-width="7"/>
    <!-- Lo que asoma de la bolsa -->
    <circle cx="176" cy="226" r="24" fill="#EF4444"/>
    <path d="M176 206c-6-5-13-5-18-2 5 2 8 5 10 8 3-3 6-5 8-6z" fill="#16A34A"/>
    <path d="M214 204h18l-4 42h-10z" fill="#FDE68A"/>
    <circle cx="246" cy="222" r="20" fill="#84CC16"/>
  </g>

  <!-- Paquete de fideos al costado -->
  <g transform="translate(300 260) rotate(8)">
    <rect x="0" y="0" width="74" height="106" rx="10" fill="#FBBF24"/>
    <rect x="0" y="30" width="74" height="34" fill="#FEF3C7" opacity=".9"/>
    <g stroke="#D97706" stroke-width="5" stroke-linecap="round" opacity=".7">
      <path d="M14 40v14"/><path d="M28 40v14"/><path d="M42 40v14"/><path d="M56 40v14"/>
    </g>
  </g>

  <rect y="368" width="480" height="112" fill="#0C1F52" opacity=".45"/>
</svg>
