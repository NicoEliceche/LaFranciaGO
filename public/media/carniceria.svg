<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" width="480" height="480" role="img">
  <!-- Carnicería: corte con hueso y bife sobre tabla, y una ristra de chorizos. -->
  <defs>
    <linearGradient id="car-fondo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7F1D1D"/>
      <stop offset="1" stop-color="#B91C1C"/>
    </linearGradient>
    <radialGradient id="car-luz" cx="30%" cy="16%" r="70%">
      <stop offset="0" stop-color="#FECACA" stop-opacity=".34"/>
      <stop offset="1" stop-color="#FECACA" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="car-tabla" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#A9713A"/>
      <stop offset="1" stop-color="#7C4A1E"/>
    </linearGradient>
  </defs>

  <rect width="480" height="480" fill="url(#car-fondo)"/>
  <rect width="480" height="480" fill="url(#car-luz)"/>

  <!-- Ristra de chorizos colgando -->
  <g>
    <path d="M96 96h288" stroke="#78350F" stroke-width="7" stroke-linecap="round"/>
    <g fill="#9A3412">
      <path d="M140 104c22-6 38 10 34 32-3 18-20 28-34 22-16-6-20-46 0-54z"/>
      <path d="M212 104c22-6 38 10 34 32-3 18-20 28-34 22-16-6-20-46 0-54z"/>
      <path d="M284 104c22-6 38 10 34 32-3 18-20 28-34 22-16-6-20-46 0-54z"/>
    </g>
    <g fill="#C2410C" opacity=".55">
      <ellipse cx="150" cy="122" rx="7" ry="11"/>
      <ellipse cx="222" cy="122" rx="7" ry="11"/>
      <ellipse cx="294" cy="122" rx="7" ry="11"/>
    </g>
  </g>

  <!-- Tabla -->
  <g>
    <path d="M86 300h308a14 14 0 0 1 14 14v18a14 14 0 0 1-14 14H86a14 14 0 0 1-14-14v-18a14 14 0 0 1 14-14z" fill="url(#car-tabla)"/>
    <rect x="72" y="300" width="336" height="12" rx="6" fill="#C08A4E"/>
  </g>

  <!-- Corte con hueso (ojo de bife) -->
  <g transform="translate(176 206)">
    <path d="M22 0c44-8 92 6 106 38 12 28-10 54-48 58-40 4-84-10-94-38C-22 32-6 4 22 0z" fill="#E11D48"/>
    <path d="M40 18c30-6 62 2 74 22 8 16-6 32-32 34-28 2-58-6-66-24-6-14 4-28 24-32z" fill="#F43F5E" opacity=".75"/>
    <!-- Hueso -->
    <path d="M96 44c10-8 24-6 28 4 4 10-4 18-14 18-8 0-16-6-16-14 0-3 1-6 2-8z" fill="#FDF2F8"/>
    <!-- Grasa del borde -->
    <path d="M12 12c-14 8-20 22-14 34" fill="none" stroke="#FFE4E6" stroke-width="10" stroke-linecap="round" opacity=".8"/>
  </g>

  <!-- Bife más chico apoyado adelante -->
  <g transform="translate(272 258) rotate(-8)">
    <path d="M0 18C0 4 18-6 40-6s40 10 40 24-18 24-40 24S0 32 0 18z" fill="#BE123C"/>
    <path d="M14 16c0-8 12-14 26-14s26 6 26 14-12 14-26 14-26-6-26-14z" fill="#E11D48" opacity=".7"/>
  </g>

  <!-- Cuchillo -->
  <g transform="translate(104 246) rotate(-12)">
    <path d="M0 8h96l22 10-22 10H0z" fill="#E2E8F0"/>
    <rect x="-46" y="8" width="48" height="20" rx="8" fill="#44403C"/>
  </g>

  <rect y="368" width="480" height="112" fill="#450A0A" opacity=".45"/>
</svg>
