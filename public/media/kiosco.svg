<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" width="480" height="480" role="img">
  <!-- Kiosco: golosinas, chocolate, alfajor y chicles. -->
  <defs>
    <linearGradient id="kio-fondo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#831843"/>
      <stop offset="1" stop-color="#DB2777"/>
    </linearGradient>
    <radialGradient id="kio-luz" cx="30%" cy="16%" r="70%">
      <stop offset="0" stop-color="#FBCFE8" stop-opacity=".38"/>
      <stop offset="1" stop-color="#FBCFE8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="480" height="480" fill="url(#kio-fondo)"/>
  <rect width="480" height="480" fill="url(#kio-luz)"/>

  <!-- Frasco de caramelos -->
  <g transform="translate(78 168)">
    <rect x="18" y="-16" width="62" height="18" rx="6" fill="#0F172A"/>
    <path d="M8 2h82a14 14 0 0 1 14 14v148a14 14 0 0 1-14 14H8a14 14 0 0 1-14-14V16A14 14 0 0 1 8 2z" fill="#FFFFFF" opacity=".3"/>
    <g>
      <circle cx="22" cy="130" r="15" fill="#F97316"/>
      <circle cx="56" cy="142" r="15" fill="#22C55E"/>
      <circle cx="86" cy="128" r="14" fill="#EAB308"/>
      <circle cx="38" cy="104" r="14" fill="#38BDF8"/>
      <circle cx="72" cy="100" r="13" fill="#A855F7"/>
      <circle cx="26" cy="76" r="12" fill="#EF4444"/>
      <circle cx="62" cy="70" r="12" fill="#F472B6"/>
    </g>
    <path d="M2 24v140" stroke="#FFFFFF" stroke-opacity=".4" stroke-width="8" stroke-linecap="round"/>
  </g>

  <!-- Chocolate con un cuadrado partido -->
  <g transform="translate(212 216) rotate(-8)">
    <rect x="0" y="0" width="120" height="84" rx="8" fill="#78350F"/>
    <g fill="#92400E">
      <rect x="6" y="6" width="34" height="34" rx="4"/>
      <rect x="44" y="6" width="34" height="34" rx="4"/>
      <rect x="82" y="6" width="32" height="34" rx="4"/>
      <rect x="6" y="44" width="34" height="34" rx="4"/>
      <rect x="44" y="44" width="34" height="34" rx="4"/>
    </g>
    <rect x="82" y="44" width="32" height="34" rx="4" fill="#FCD34D" opacity=".35"/>
  </g>

  <!-- Alfajor mordido -->
  <g transform="translate(300 300)">
    <circle cx="40" cy="40" r="40" fill="#5B2C0D"/>
    <circle cx="40" cy="34" r="40" fill="#7C3A10"/>
    <path d="M6 24a40 40 0 0 1 68 0z" fill="#C88A4A" opacity=".35"/>
    <circle cx="40" cy="34" r="16" fill="#D9A066" opacity=".5"/>
  </g>

  <!-- Chupetín -->
  <g transform="translate(140 300)">
    <rect x="34" y="34" width="8" height="70" rx="4" fill="#FFFFFF" opacity=".85"/>
    <circle cx="38" cy="36" r="34" fill="#FFFFFF"/>
    <path d="M38 36m0-34a34 34 0 0 1 0 68" fill="#EF4444"/>
    <path d="M38 36a20 20 0 0 0 0-26 20 20 0 0 0 0 26z" fill="#F472B6"/>
  </g>

  <!-- Chicles sueltos -->
  <g>
    <rect x="212" y="330" width="34" height="22" rx="8" fill="#38BDF8"/>
    <rect x="252" y="342" width="32" height="20" rx="8" fill="#4ADE80"/>
  </g>

  <rect y="368" width="480" height="112" fill="#4A0B29" opacity=".42"/>
</svg>
